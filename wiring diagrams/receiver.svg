<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Gesture RC Car receiver wiring</title>
  <desc id="desc">ESP32-C3 Super Mini connected to a TB6612FNG motor driver and two DC motors. Receiver signals use GPIO 0, 1, 3, 4, 5, 6 and 10. Grounds are common and the motor supply is separate from the ESP32 supply.</desc>
  <rect width="1000" height="540" fill="#f8fafc" rx="20"/>
  <text x="500" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#162033">Gesture RC Car · Receiver Wiring</text>
  <text x="500" y="68" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">ESP32-C3 Super Mini · TB6612FNG · two DC motors</text>
  <rect x="42" y="115" width="340" height="330" rx="16" fill="#123d57" stroke="#0b2738" stroke-width="2"/>
  <text x="212" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">ESP32-C3</text>
  <text x="212" y="171" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#cfe8f2">receiver board</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#fff">
    <text x="70" y="215">GPIO 0 · PWMA</text>
    <text x="70" y="249">GPIO 1 · AIN1</text>
    <text x="70" y="283">GPIO 3 · AIN2</text>
    <text x="70" y="317">GPIO 4 · STBY</text>
    <text x="70" y="351">GPIO 5 · BIN1</text>
    <text x="70" y="385">GPIO 6 · BIN2</text>
    <text x="70" y="419">GPIO 10 · PWMB</text>
  </g>
  <rect x="460" y="115" width="295" height="330" rx="16" fill="#e8eef5" stroke="#64748b" stroke-width="2"/>
  <text x="607" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#162033">TB6612FNG</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#162033">
    <text x="485" y="215">PWMA</text><text x="485" y="249">AIN1</text><text x="485" y="283">AIN2</text><text x="485" y="317">STBY</text>
    <text x="485" y="351">BIN1</text><text x="485" y="385">BIN2</text><text x="485" y="419">PWMB</text>
  </g>
  <rect x="825" y="175" width="135" height="82" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="892" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#162033">Motor A</text>
  <text x="892" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">channel A</text>
  <rect x="825" y="305" width="135" height="82" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="892" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#162033">Motor B</text>
  <text x="892" y="362" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">channel B</text>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M382 209 H460" stroke="#d97706"/><path d="M382 243 H460" stroke="#dc2626"/><path d="M382 277 H460" stroke="#2563eb"/><path d="M382 311 H460" stroke="#16a34a"/>
    <path d="M382 345 H460" stroke="#9333ea"/><path d="M382 379 H460" stroke="#0d9488"/><path d="M382 413 H460" stroke="#b45309"/>
    <path d="M755 215 H790 V216 H825" stroke="#d97706"/><path d="M755 351 H790 V346 H825" stroke="#0d9488"/>
  </g>
  <rect x="42" y="466" width="918" height="48" rx="10" fill="#fff3cd" stroke="#d97706"/>
  <text x="60" y="486" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">Power and safety</text>
  <text x="60" y="503" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">Connect ESP32 GND, driver GND and battery GND together. Power motors from the driver supply, not GPIO pins.</text>
</svg>